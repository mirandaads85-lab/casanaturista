; No mostrar errores/warnings/deprecated como HTML en el navegador
display_errors = Off
display_startup_errors = Off

; Pero sí registrarlos en el log del contenedor (para poder depurar con logs de Render)
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_NOTICE

; Evita filtrar la versión de PHP en las cabeceras HTTP (buena práctica de seguridad)
expose_php = Off
